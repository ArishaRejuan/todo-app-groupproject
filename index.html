<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="./style.css">
  
  <title>Frontend Mentor | Todo app</title>
</head>

<body>
  <header>
    <h1>TODO</h1>
    <img src="images/icon-sun.svg">
  </header>

  <main>
    <div class="create-box-container">
      <div class="create-box">
        <label class="checkbox-label">
          <input type="checkbox">
        </label>
        <input type="text" placeholder="Create a new todo...">
      </div>
    </div>

    <div class="result-container">
      <div class="results">
        <!-- New Result Box -->
        <div class="result">
          <div class="checkbox-label">
            <input type="checkbox">
          </div>
          <div class="result-text">
            <p>Complete online JavaScript course</p>
          </div>
          <div class="cross-icon-container">
            <img class="cross-icon" src="images/icon-cross.svg">
          </div>
        </div>
        <!-- New Result Box -->
        <div class="result">
          <div class="checkbox-label">
            <input type="checkbox">
          </div>
          <div class="result-text">
            <p>Jag around the park 3x</p>
          </div>
          <div class="cross-icon-container">
            <img class="cross-icon" src="images/icon-cross.svg">
          </div>
        </div> 
        <!-- New Result Box -->
        <div class="result">
          <div class="checkbox-label">
            <input type="checkbox">
          </div>
          <div class="result-text">
            <p>10 minutes meditation</p>
          </div>
          <div class="cross-icon-container">
            <img class="cross-icon" src="images/icon-cross.svg">
          </div>
        </div>
        <!-- New Result Box -->
        <div class="result">
          <div class="checkbox-label">
            <input type="checkbox">
          </div>
          <div class="result-text">
            <p>Read for 1 hour</p>
          </div>
          <div class="cross-icon-container">
            <img class="cross-icon" src="images/icon-cross.svg">
          </div>
        </div> 
        <!-- New Result Box --> 
        <div class="result">
          <div class="checkbox-label">
            <input type="checkbox">
          </div>
          <div class="result-text">
            <p>Pick up groceries</p>
          </div>
          <div class="cross-icon-container">
            <img class="cross-icon" src="images/icon-cross.svg">
          </div>
        </div>
        <!-- New Result Box --> 
        <div class="result">
          <div class="checkbox-label">
            <input type="checkbox">
          </div>
          <div class="result-text">
            <p>Complete Todo App on Frontend Mentor</p>
          </div>
          <div class="cross-icon-container">
            <img class="cross-icon" src="images/icon-cross.svg">
          </div>
        </div>
        <div class="todo-info">
          <p>5 items left</p>
          <p> Clear Completed</p>
        </div>
      </div>
    </div>

  </main>

</body>
</html>
